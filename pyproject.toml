[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "cheat-cli"
version = "0.1.3"
description = "A terminal-first personal cheat sheet for developers"
readme = "README.md"
license = "MIT"
authors = [{name = "RejishJ"}]
requires-python = ">=3.9"
dependencies = [
    "tabulate>=0.9",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/RejishJ/cheat-cli"
Repository = "https://github.com/RejishJ/cheat-cli"
Changelog = "https://github.com/RejishJ/cheat-cli/blob/main/CHANGELOG.md"

[project.scripts]
cheat = "cheat_cli.cli:main"
cheat-cli = "cheat_cli.cli:main"

[project.optional-dependencies]
tui = [
    "textual>=0.40",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
    "textual>=0.40",
]

[tool.setuptools.packages.find]
include = ["cheat_cli*"]

[tool.setuptools.package-data]
cheat_cli = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py39"
line-length = 100
